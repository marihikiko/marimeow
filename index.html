<!DOCTYPE html>

<style>
body {
  background: #fff5fb;
  font-family: "Arial", sans-serif;
  color: #4a354d;
}

.cat-card {
  background: #ffffff;
  border: 3px solid #e8b7dc;
  border-radius: 25px;
  width: 420px;
  margin: 80px auto;
  padding: 30px;
  text-align: center;
  box-shadow: 0 8px 25px rgba(200, 150, 200, 0.25);
  position: relative;
}

.ears span {
  position: absolute;
  top: -25px;
  width: 55px;
  height: 55px;
  background: #ffffff;
  border: 3px solid #e8b7dc;
  transform: rotate(45deg);
  border-radius: 10px;
}

.ears span:first-child {
  left: 55px;
}

.ears span:last-child {
  right: 55px;
}

h1 {
  margin-top: 20px;
}

h1::before {
  content: "ฅ^•ﻌ•^ฅ ";
}

h1::after {

}

.dni {
  background: #fff0fa;
  border: 2px dashed #dba3d0;
  border-radius: 15px;
  padding: 12px;
  margin: 20px 0;
  font-size: 14px;
}

.discord {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 50%;
  border: 4px solid #e8b7dc;
  margin: 15px;
}

.buttons {
  margin-top: 10px;
}

.btn {
  display: inline-block;
  background: #e8b7dc;
  color: white;
  padding: 12px 25px;
  border-radius: 20px;
  text-decoration: none;
  transition: 0.2s;
}

.btn:hover {
  background: #d28ac4;
  transform: translateY(-3px);
}

.footer {
  margin-top: 25px;
  font-size: 13px;
  opacity: 0.7;
}
</style>

</head>
