<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>marimeow.lol</title>

  <!-- Cute pixel font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#ffd9f2;
      --bg2:#ffe8f7;
      --card:#fff0fa;
      --pink:#ff78c8;
      --pink2:#ff9ed8;
      --text:#5b2b52;
      --shadow:#ffb6e1;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at 20% 20%, #ffffff88 0 8px, transparent 9px),
        radial-gradient(circle at 80% 30%, #ffffff66 0 6px, transparent 7px),
        radial-gradient(circle at 40% 80%, #ffffff66 0 10px, transparent 11px),
        linear-gradient(180deg,var(--bg),var(--bg2));
      font-family:"Press Start 2P", system-ui;
      color:var(--text);
      overflow:hidden;
      cursor:url("https://cur.cursors-4u.net/cursors/cur-2/cur117.cur"), auto;
    }

    a, button{
      cursor:url("https://cur.cursors-4u.net/cursors/cur-2/cur116.cur"), pointer;
    }

    .sparkle{
      position:fixed;
      width:10px;
      height:10px;
      pointer-events:none;
      background:white;
      border-radius:50%;
      box-shadow:0 0 10px white;
      animation:fade 700ms linear forwards;
      z-index:9999;
    }

    @keyframes fade{
      to{
        transform:translateY(-12px) scale(0);
        opacity:0;
      }
    }

    .card{
      width:min(92vw,560px);
      background:var(--card);
      border:4px solid var(--pink);
      border-radius:24px;
      padding:28px;
      text-align:center;
      box-shadow:0 12px 0 var(--shadow);
      position:relative;
    }

    .windowbar{
      position:absolute;
      inset:0 0 auto 0;
      height:32px;
      background:linear-gradient(90deg,var(--pink),var(--pink2));
      border-radius:20px 20px 0 0;
      border-bottom:3px solid #ff5db7;
    }

    .dots{
      display:flex;
      gap:8px;
      padding:8px 12px;
    }

    .dot{
      width:12px;
      height:12px;
      border-radius:50%;
      background:#fff;
      border:2px solid #ff5db7;
    }

    h1{
      margin:44px 0 10px;
      font-size:24px;
      color:#ff4fb4;
      text-shadow:2px 2px #fff;
    }

    p{
      font-size:11px;
      line-height:1.8;
      margin:0 0 18px;
    }

    .discord{
      width:200px;
      max-width:70vw;
      border-radius:18px;
      border:4px solid var(--pink);
      box-shadow:0 8px 0 var(--shadow);
      image-rendering:auto;
      margin:10px auto 20px;
      display:block;
    }

    .buttons{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:8px;
    }

    .btn{
      text-decoration:none;
      color:var(--text);
      background:white;
      border:3px solid var(--pink);
      border-radius:14px;
      padding:12px 16px;
      font-size:10px;
      box-shadow:0 4px 0 var(--shadow);
      transition:transform .08s ease;
    }

    .btn:hover{ transform:translateY(-2px); }
    .btn:active{
      transform:translateY(2px);
      box-shadow:0 2px 0 var(--shadow);
    }

    .footer{
      margin-top:18px;
      font-size:9px;
      opacity:.8;
    }

    .heart{
      position:fixed;
      font-size:18px;
      opacity:.18;
      animation:float 10s linear infinite;
      user-select:none;
    }

    @keyframes float{
      from{ transform:translateY(110vh) rotate(0deg); }
      to{ transform:translateY(-20vh) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="heart" style="left:10%; animation-delay:0s;">❤</div>
  <div class="heart" style="left:30%; animation-delay:2s;">❤</div>
  <div class="heart" style="left:55%; animation-delay:4s;">❤</div>
  <div class="heart" style="left:80%; animation-delay:1s;">❤</div>

  <main class="card">
    <div class="windowbar">
      <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <h1>marimeow.lol</h1>
    <p>cute pink corner of the internet ✿<br>made by mari</p>

    <!-- Put your Discord image in the repo as discord.png -->
    <img src="discord.png" alt="My Discord profile" class="discord">

    <div class="buttons">
      <a class="btn" href="https://discord.com" target="_blank">discord</a>
    </div>

    <div class="footer">
      best viewed with a computer.. <.< ✧
    </div>
  </main>

  <script>
    document.addEventListener('mousemove', (e) => {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.left = e.pageX + 'px';
      s.style.top = e.pageY + 'px';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 700);
    });
  </script>
</body>
</html>
